<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .section-head h1 {
      font-size: var(--fs-xl);
    }
    .order-form {
      padding: var(--space-4);
      background: var(--color-white);
      border: var(--line-width) solid var(--line-color-soft);
      border-radius: var(--radius);
    }
    .order-form .btn {
      margin-top: var(--space-2);
    }
    .order-form .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .form-hint {
      margin: 0.25rem 0 0;
      font-size: var(--fs-xs);
      color: var(--color-ink-mute);
    }
    @media (max-width: 640px) {
      .order-form {
        padding: var(--space-3);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">

        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="rule">
          <p>กรอกข้อมูลของคุณ เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">

          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input class="input" type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input class="input" type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea class="textarea" id="items" name="items" rows="2" style="min-height: 5rem;" required></textarea>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input class="input" type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea class="textarea" id="note" name="note" rows="3" style="min-height: 6rem;"></textarea>
            <p class="form-hint">ไม่บังคับ เช่น ที่อยู่จัดส่งหรือเวลาที่สะดวกให้ติดต่อ</p>
          </div>

          <button class="btn btn--solid btn--block" type="submit">ยืนยันสั่งซื้อ</button>

        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; Body Scent. สงวนลิขสิทธิ์
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
