<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .section-head h1 {
      font-size: var(--fs-xl);
    }
    .table-wrap {
      overflow-x: auto;
      background: var(--color-white);
      border: var(--line-width) solid var(--line-color-soft);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: var(--fs-sm);
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      border-bottom: var(--line-width) solid var(--line-color-soft);
    }
    #ordersTable thead th {
      font-weight: 500;
      color: var(--color-ink);
      white-space: nowrap;
      background: var(--color-cream);
      border-bottom: var(--line-width) solid var(--line-color);
    }
    #ordersTable tbody td {
      color: var(--color-ink-soft);
    }
    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }
    #ordersTable tbody tr:hover td {
      background: var(--color-ivory);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section-head">
          <h1>รายการสั่งซื้อ</h1>
          <hr class="rule">
          <p>เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; Body Scent. สงวนลิขสิทธิ์
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
